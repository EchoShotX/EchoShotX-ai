version: 0.0
os: linux

files:
  - source: /
    destination: /opt/echoshot-worker

hooks:
  BeforeInstall:
    - location: scripts/deploy/before_install.sh
      timeout: 300
      runas: root

  Install:
    - location: scripts/deploy/install.sh
      timeout: 600
      runas: root

  AfterInstall:
    - location: scripts/deploy/after_install.sh
      timeout: 300
      runas: root

  ApplicationStart:
    - location: scripts/deploy/application_start.sh
      timeout: 300
      runas: root

  ApplicationStop:
    - location: scripts/deploy/application_stop.sh
      timeout: 300
      runas: root

  ValidateService:
    - location: scripts/deploy/validate_service.sh
      timeout: 60
      runas: root

